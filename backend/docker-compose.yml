name: bugx

services:
  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: bugx
      POSTGRES_PASSWORD: bugx
      POSTGRES_DB: bugx
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  judge0-db:
    image: postgres:16.2
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
      POSTGRES_DB: judge0
    volumes:
      - judge0-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly no --requirepass "judge0_redis_password"

  judge0-server:
    image: mrkushalsm/judge0:cgv2
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
      POSTGRES_DB: judge0
      POSTGRES_HOST: judge0-db
      REDIS_PASSWORD: judge0_redis_password
      REDIS_HOST: judge0-redis
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_NETWORK: "false"
      ENABLE_WAIT_RESULT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
      JAVA_TOOL_OPTIONS: "-Xmx128m"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      - judge0-db
      - judge0-redis
    ports:
      - "${JUDGE0_HOST_PORT:-2358}:2358"
    privileged: true
    restart: always

  judge0-workers:
    image: mrkushalsm/judge0:cgv2
    command: ["./scripts/workers"]
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
      POSTGRES_DB: judge0
      POSTGRES_HOST: judge0-db
      REDIS_PASSWORD: judge0_redis_password
      REDIS_HOST: judge0-redis
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
      JAVA_TOOL_OPTIONS: "-Xmx128m"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      - judge0-db
      - judge0-redis
    privileged: true
    restart: always

  api:
    build: .
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://bugx:bugx@postgres:5432/bugx
      REDIS_URL: redis://redis:6379/0
      JUDGE0_URL: http://judge0-server:2358
      USE_LOCAL_JUDGE: "true"
      PYTHONUTF8: "1"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"

  worker:
    build: .
    command: python -m app.workers.submission_worker
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://bugx:bugx@postgres:5432/bugx
      REDIS_URL: redis://redis:6379/0
      JUDGE0_URL: http://judge0-server:2358
      USE_LOCAL_JUDGE: "true"
      PYTHONUTF8: "1"

  import-worker:
    build: .
    command: python -m app.workers.import_worker
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://bugx:bugx@postgres:5432/bugx
      REDIS_URL: redis://redis:6379/0
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: bugX
      # Feature flags
      VITE_FEATURE_PUBLIC_PROFILES: "true"
      VITE_FEATURE_RESUME_EXPORT: "true"
      VITE_FEATURE_ANALYTICS: "true"
      VITE_FEATURE_DAILY_CHALLENGE: "true"
      VITE_FEATURE_TOPIC_MASTERY: "false"
      VITE_FEATURE_BADGES: "false"
      VITE_FEATURE_RATING_GRAPH: "false"
      VITE_FEATURE_SIMILAR_PROBLEMS: "false"
      VITE_FEATURE_COLLECTIONS: "false"
      VITE_FEATURE_ROADMAPS: "false"
      VITE_FEATURE_COMPANY_PREP: "false"
      VITE_FEATURE_VISUALIZER: "false"
      VITE_FEATURE_FORUM: "false"
      VITE_FEATURE_FRIENDS: "false"
      VITE_FEATURE_COMMUNITY_CHALLENGES: "false"
      VITE_FEATURE_NOTIFICATIONS: "false"
    depends_on:
      - api

volumes:
  judge0-data:
  postgres-data:
  redis-data:
